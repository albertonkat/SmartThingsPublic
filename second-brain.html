// ─── BUILD GRAPH ───────────────────────────────────────────────────────────

function capLabel(key) {
  return key.replace(/([A-Z])/g, ' $1').replace(/^./, s => s.toUpperCase());
}

function buildGraph() {
  const capMap = new Map();
  const nodes = [];
  const edges = [];

  // Collect all caps that actually appear
  const allCaps = new Set();
  for (const [,,caps] of RAW_APPS) caps.forEach(c => INTERESTING.has(c) && allCaps.add(c));
  for (const [,,caps] of RAW_DEVICES) caps.forEach(c => INTERESTING.has(c) && allCaps.add(c));

  // Capability nodes
  for (const cap of allCaps) {
    const cat = CAP_CATEGORIES[cap] || 'media';
    const node = { id:'cap-'+cap, name:capLabel(cap), type:'capability', cat, color:CAT_COLOR[cat], connections:0, caps:[] };
    capMap.set(cap, node);
    nodes.push(node);
  }

  // SmartApp nodes + edges
  for (let i = 0; i < RAW_APPS.length; i++) {
    const [vendor,name,caps] = RAW_APPS[i];
    const node = { id:'app-'+i, name, type:'smartapp', vendor, color:'#6C8EBF', connections:0, caps:[] };
    nodes.push(node);
    const seen = new Set();
    for (const c of caps) {
      if (!INTERESTING.has(c) || seen.has(c)) continue;
      seen.add(c);
      const cn = capMap.get(c);
      if (!cn) continue;
      node.caps.push(cn.name);
      cn.connections++;
      node.connections++;
      edges.push({ source:node, target:cn });
    }
  }

  // Device nodes + edges
  for (let i = 0; i < RAW_DEVICES.length; i++) {
    const [vendor,name,caps] = RAW_DEVICES[i];
    const node = { id:'dev-'+i, name, type:'devicetype', vendor, color:'#82B366', connections:0, caps:[] };
    nodes.push(node);
    const seen = new Set();
    for (const c of caps) {
      if (!INTERESTING.has(c) || seen.has(c)) continue;
      seen.add(c);
      const cn = capMap.get(c);
      if (!cn) continue;
      node.caps.push(cn.name);
      cn.connections++;
      node.connections++;
      edges.push({ source:node, target:cn });
    }
  }

  return { nodes, edges };
}

// ─── FORCE SIMULATION ─────────────────────────────────────────────────────

function simulate(nodes, edges, onProgress) {
  const R = 160;
  for (const n of nodes) {
    const th = Math.random() * Math.PI * 2;
    const ph = Math.acos(2*Math.random()-1);
    const r  = R * (0.4 + Math.random() * 0.6);
    n.px = r * Math.sin(ph) * Math.cos(th);
    n.py = r * Math.sin(ph) * Math.sin(th);
    n.pz = r * Math.cos(ph);
    n.vx = n.vy = n.vz = 0;
  }

  const ITERS = 280;
  const repK  = 7000;
  const sprK  = 0.08;
  const sprL  = 70;
  const damp  = 0.82;
  const clust = 0.6;

  for (let iter = 0; iter < ITERS; iter++) {
    const alpha = 1 - iter / ITERS;

    for (const n of nodes) { n.fx = 0; n.fy = 0; n.fz = 0; }

    // Repulsion O(n²) — fast enough for ~160 nodes
    for (let i = 0; i < nodes.length; i++) {
      const a = nodes[i];
      for (let j = i+1; j < nodes.length; j++) {
        const b = nodes[j];
        let dx = a.px-b.px, dy = a.py-b.py, dz = a.pz-b.pz;
        const r2 = dx*dx + dy*dy + dz*dz + 1;
        const r  = Math.sqrt(r2);
        const f  = repK / r2;
        dx /= r; dy /= r; dz /= r;
        a.fx += f*dx; a.fy += f*dy; a.fz += f*dz;
        b.fx -= f*dx; b.fy -= f*dy; b.fz -= f*dz;
      }
    }

    // Springs
    for (const e of edges) {
      const a = e.source, b = e.target;
      let dx = b.px-a.px, dy = b.py-a.py, dz = b.pz-a.pz;
      const r = Math.sqrt(dx*dx+dy*dy+dz*dz) + 0.01;
      const f = sprK * (r - sprL);
      dx /= r; dy /= r; dz /= r;
      a.fx += f*dx; a.fy += f*dy; a.fz += f*dz;
      b.fx -= f*dx; b.fy -= f*dy; b.fz -= f*dz;
    }

    // Cluster gravity
    for (const n of nodes) {
      const ty = n.type==='smartapp' ? 90 : n.type==='devicetype' ? -90 : 0;
      n.fy += clust * (ty - n.py) * alpha;
    }

    // Integrate
    for (const n of nodes) {
      n.vx = (n.vx + n.fx * 0.1) * damp;
      n.vy = (n.vy + n.fy * 0.1) * damp;
      n.vz = (n.vz + n.fz * 0.1) * damp;
      n.px += n.vx; n.py += n.vy; n.pz += n.vz;
    }

    if (iter % 40 === 0) onProgress(iter / ITERS);
  }
}

// ─── MAIN ─────────────────────────────────────────────────────────────────

function setProgress(p) { lfill.style.width = (p * 100) + '%'; }

// ─── THREE.JS ─────────────────────────────────────────────────────────────

const W = window.innerWidth, H = window.innerHeight;
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(W, H);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ReinhardToneMapping;
renderer.toneMappingExposure = 1.2;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.getElementById('canvas-container').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000511);
scene.fog = new THREE.FogExp2(0x000511, 0.0022);

const camera = new THREE.PerspectiveCamera(58, W/H, 0.5, 2000);
camera.position.set(0, 60, 310);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 40;
controls.maxDistance = 700;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.25;

// Bloom
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(W, H), 1.4, 0.5, 0.15);
composer.addPass(bloom);

// Lights

const pl1 = new THREE.PointLight(0x2255ff, 4, 700); pl1.position.set(150, 200, 100); scene.add(pl1);
const pl2 = new THREE.PointLight(0xff3300, 3, 600); pl2.position.set(-200,-100,-150); scene.add(pl2);

scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color:0x3355aa, size:0.5 })));

const nodeById = new Map();

for (const node of nodes) {
  let r;
  if (node.type === 'capability') r = 4 + Math.min(node.connections * 0.7, 11);
  else r = 3.2;

  const geo = new THREE.SphereGeometry(r, 20, 20);
  const col = new THREE.Color(node.color);
  const mat = new THREE.MeshStandardMaterial({
    color: col,
    emissive: col,
    emissiveIntensity: node.type==='capability' ? 1.0 : 0.55,
    roughness: 0.25,
    metalness: 0.45,
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(node.px, node.py, node.pz);
  mesh.userData = { node, baseEI: mat.emissiveIntensity, baseColor: col.clone(), r };
  scene.add(mesh);
  meshes.push(mesh);
  nodeById.set(node.id, mesh);
}

// ─── EDGES ────────────────────────────────────────────────────────────────

const edgeGroup = new THREE.Group();
const edgeMats = [];

for (const e of edges) {
  const sm = nodeById.get(e.source.id);
  const tm = nodeById.get(e.target.id);
  if (!sm || !tm) continue;
  const pts = [sm.position.clone(), tm.position.clone()];
  const geo = new THREE.BufferGeometry().setFromPoints(pts);
  const mat = new THREE.LineBasicMaterial({
    color: new THREE.Color(e.target.color),
    transparent: true, opacity: 0.16, depthWrite: false,
  });
  edgeGroup.add(new THREE.Line(geo, mat));
  edgeMats.push(mat);
}
scene.add(edgeGroup);

// ─── LABELS (capabilities only) ───────────────────────────────────────────

function makeSprite(text, hexColor) {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 48;
  const ctx = c.getContext('2d');
  ctx.font = 'bold 18px Courier New';
  ctx.fillStyle = hexColor;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, 128, 24);
  const tex = new THREE.CanvasTexture(c);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map:tex, transparent:true, opacity:0.9 }));
  sp.scale.set(36, 7, 1);
  return sp;
}

for (const node of nodes) {
  if (node.type !== 'capability') continue;
  const mesh = nodeById.get(node.id);
  const sp = makeSprite(node.name, node.color);
  sp.position.copy(mesh.position);
  sp.position.y += mesh.userData.r + 7;
  scene.add(sp);
}

// ─── STATS ────────────────────────────────────────────────────────────────

const nApps = nodes.filter(n=>n.type==='smartapp').length;
const nDevs = nodes.filter(n=>n.type==='devicetype').length;
const nCaps = nodes.filter(n=>n.type==='capability').length;
document.getElementById('stats').textContent =
  `${nApps} SmartApps · ${nDevs} Devices · ${nCaps} Capabilities · ${edges.length} Connections`;

// ─── INTERACTION ──────────────────────────────────────────────────────────

const ray = new THREE.Raycaster();
const mouse = new THREE.Vector2();
const tooltip = document.getElementById('tooltip');
let hovered = null, selected = null;

function highlight(node) {
  const connected = new Set([node.id]);
  const edgeIdxs = new Set();
  edges.forEach((e,i) => {
    if (e.source.id===node.id || e.target.id===node.id) {
      connected.add(e.source.id); connected.add(e.target.id); edgeIdxs.add(i);
    }
  });
  meshes.forEach(m => {
    const on = connected.has(m.userData.node.id);
    m.material.emissive.copy(m.userData.baseColor).multiplyScalar(on ? 1.5 : 0.12);
    m.material.emissiveIntensity = on ? m.userData.baseEI * 1.6 : m.userData.baseEI * 0.15;
  });
  edgeMats.forEach((mat,i) => { mat.opacity = edgeIdxs.has(i) ? 0.75 : 0.03; });
}

function reset() {
  meshes.forEach(m => {
    m.material.emissive.copy(m.userData.baseColor);
    m.material.emissiveIntensity = m.userData.baseEI;
  });
  edgeMats.forEach(mat => { mat.opacity = 0.16; });
}

function showTip(node, x, y) {
  tooltip.querySelector('.tt-name').textContent = node.name;
  tooltip.querySelector('.tt-type').textContent =
    node.type==='capability' ? '⬡ CAPABILITY' :
    node.type==='smartapp'   ? '◈ SMART APP'  : '◉ DEVICE TYPE';
  tooltip.querySelector('.tt-vendor').textContent = node.vendor ? `by ${node.vendor}` : '';
  tooltip.querySelector('.tt-info').textContent =
    node.type==='capability'
      ? `${node.connections} connections · ${node.cat}`
      : (node.caps.length ? node.caps.join(' · ') : '');
  tooltip.style.left = Math.min(x+14, innerWidth-280)+'px';
  tooltip.style.top  = Math.min(y-10, innerHeight-140)+'px';
  tooltip.style.display = 'block';
}

renderer.domElement.addEventListener('mousemove', e => {
  mouse.x = (e.clientX/W)*2-1;
  mouse.y = -(e.clientY/H)*2+1;
  ray.setFromCamera(mouse, camera);
  const hits = ray.intersectObjects(meshes);
  if (hits.length) {
    const node = hits[0].object.userData.node;
    if (hovered !== node) { hovered = node; if (!selected) highlight(node); }
    showTip(node, e.clientX, e.clientY);
    renderer.domElement.style.cursor = 'pointer';
  } else {
    if (hovered) { hovered = null; if (!selected) reset(); tooltip.style.display='none'; }
    renderer.domElement.style.cursor = 'default';
  }
});

renderer.domElement.addEventListener('click', e => {
  ray.setFromCamera(mouse, camera);
  const hits = ray.intersectObjects(meshes);
  if (hits.length) {
    const node = hits[0].object.userData.node;
    if (selected === node) { selected = null; hovered ? highlight(hovered) : reset(); }
    else { selected = node; highlight(node); }
  } else { selected = null; hovered ? highlight(hovered) : reset(); }
});

// Search
document.getElementById('search').addEventListener('input', e => {
  const q = e.target.value.toLowerCase().trim();
  if (!q) { selected ? highlight(selected) : hovered ? highlight(hovered) : reset(); return; }
  meshes.forEach(m => {
    const match = m.userData.node.name.toLowerCase().includes(q);
    m.material.emissive.copy(m.userData.baseColor).multiplyScalar(match ? 2 : 0.08);
    m.material.emissiveIntensity = match ? m.userData.baseEI * 2 : m.userData.baseEI * 0.08;
  });
  edgeMats.forEach(mat => { mat.opacity = 0.04; });
});

// Toggle buttons
let showApps=true, showDevs=true, showCaps=true, showEdges=true, autoRot=true;
function togBtn(id, flag, cb) {
  const btn = document.getElementById(id);
  btn.addEventListener('click', () => { flag = !flag; btn.classList.toggle('off'); cb(flag); });
  return () => flag;
}

document.getElementById('btn-apps').addEventListener('click', e => {
  showApps = !showApps; e.target.classList.toggle('off');
  meshes.forEach(m => { if (m.userData.node.type==='smartapp') m.visible=showApps; });
});
document.getElementById('btn-devices').addEventListener('click', e => {
  showDevs = !showDevs; e.target.classList.toggle('off');
  meshes.forEach(m => { if (m.userData.node.type==='devicetype') m.visible=showDevs; });
});
document.getElementById('btn-caps').addEventListener('click', e => {
  showCaps = !showCaps; e.target.classList.toggle('off');
  meshes.forEach(m => { if (m.userData.node.type==='capability') m.visible=showCaps; });
});
document.getElementById('btn-edges').addEventListener('click', e => {
  showEdges = !showEdges; e.target.classList.toggle('off');
  edgeGroup.visible = showEdges;
});
document.getElementById('btn-rotate').addEventListener('click', e => {
  autoRot = !autoRot; e.target.classList.toggle('off');
  controls.autoRotate = autoRot;
});

// Resize
window.addEventListener('resize', () => {
  const w=innerWidth, h=innerHeight;
  camera.aspect = w/h; camera.updateProjectionMatrix();
  renderer.setSize(w,h); composer.setSize(w,h);
});

// ─── ANIMATION ────────────────────────────────────────────────────────────

let t = 0;
function animate() {
  requestAnimationFrame(animate);
  t += 0.008;

  // Pulse capability nodes
  for (const node of nodes) {
    if (node.type !== 'capability') continue;
    const m = nodeById.get(node.id);
    if (!m) continue;
    const pulse = 1 + 0.07 * Math.sin(t * 1.8 + node.px * 0.04 + node.pz * 0.03);
    m.scale.setScalar(pulse);
  }

  // Drift lights for atmosphere
  pl1.position.x = Math.sin(t * 0.25) * 220;
  pl1.position.z = Math.cos(t * 0.18) * 180;
  pl2.position.x = Math.sin(t * 0.2 + 2) * -180;
  pl2.position.z = Math.cos(t * 0.22 + 1) * 160;

  controls.update();
  composer.render();
}

// Hide loading screen
const loading = document.getElementById('loading');
loading.style.opacity = '0';
setTimeout(() => { loading.style.display='none'; }, 800);

animate();
</script>
</body>
</html>
